<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Admin')}"></head>
<body>
<header th:replace="~{fragments :: nav(true)}"></header>
<main>
  <p style="display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:1.6rem;font-weight:700">Manage Events</span>
    <a class="btn" th:href="@{/admin/events/new}">+ New Event</a>
  </p>
  <div class="table-wrap">
  <table>
    <tr><th>Title</th><th>Date</th><th>Venue</th><th>Registered</th><th>Actions</th></tr>
    <tr th:each="e : ${events}">
      <td th:text="${e.title}"></td>
      <td th:text="${#temporals.format(e.eventDate,'dd MMM yyyy, hh:mm a')}"></td>
      <td th:text="${e.venue}"></td>
      <td th:text="${e.registered} + ' / ' + ${e.maxParticipants}"></td>
      <td class="actions">
        <a class="btn" th:href="@{/admin/events/{id}/registrations(id=${e.id})}">Registrations</a>
        <a class="btn gray" th:href="@{/admin/events/{id}/edit(id=${e.id})}">Edit</a>
        <form th:action="@{/admin/events/{id}/delete(id=${e.id})}" method="post" onsubmit="return confirm('Delete this event and all its registrations?')">
          <button class="red">Delete</button>
        </form>
      </td>
    </tr>
  </table>
  </div>
</main>
</body>
</html>
